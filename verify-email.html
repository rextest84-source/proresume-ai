<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Verify Email | ProResume AI</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
  <style>html,body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col">
  <div data-site-nav="default"></div>

  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 py-8 sm:py-12">
    <div class="w-full max-w-md text-center">
      <div id="state-loading">
        <div class="icon-wrap icon-wrap-lg mx-auto mb-6 animate-pulse" aria-hidden="true"><i class="fa-solid fa-spinner fa-spin"></i></div>
        <h1 class="text-2xl font-bold mb-2">Verifying your email...</h1>
        <p class="text-zinc-400">Just a moment.</p>
      </div>

      <div id="state-success" class="hidden">
        <div class="icon-wrap icon-wrap-lg mx-auto mb-6" aria-hidden="true"><i class="fa-solid fa-circle-check text-emerald-400"></i></div>
        <h1 class="text-3xl font-bold mb-3">Email verified</h1>
        <p class="text-zinc-400 mb-8">Your account is active. Redirecting to the resume builder...</p>
        <a href="/builder.html" class="inline-block px-6 py-3 bg-emerald-500 hover:bg-emerald-600 rounded-xl font-semibold transition">Open builder</a>
      </div>

      <div id="state-error" class="hidden">
        <div class="icon-wrap icon-wrap-lg mx-auto mb-6" aria-hidden="true"><i class="fa-solid fa-circle-xmark text-red-400"></i></div>
        <h1 class="text-2xl font-bold mb-3">Verification failed</h1>
        <p id="error-text" class="text-zinc-400 mb-6"></p>
        <a href="/check-email.html" class="inline-block px-6 py-3 border border-white/20 hover:bg-white/5 rounded-xl font-semibold text-sm transition">Request new link</a>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    (async () => {
      const token = new URLSearchParams(location.search).get('token');
      const loading = document.getElementById('state-loading');
      const success = document.getElementById('state-success');
      const error = document.getElementById('state-error');

      if (!token) {
        loading.classList.add('hidden');
        error.classList.remove('hidden');
        document.getElementById('error-text').textContent = 'Missing verification link. Request a new one from the sign-up page.';
        return;
      }

      try {
        await ProResumeAPI.verifyEmail(token);
        loading.classList.add('hidden');
        success.classList.remove('hidden');
        setTimeout(() => { location.href = '/builder.html'; }, 2000);
      } catch (ex) {
        loading.classList.add('hidden');
        error.classList.remove('hidden');
        document.getElementById('error-text').textContent = ex.message || 'This link is invalid or expired.';
      }
    })();
  </script>
</body>
</html>
