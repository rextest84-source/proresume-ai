name: Railway Services

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'services/**'
      - 'railway/**'
      - '.github/workflows/railway-services.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: proresume-ai
            config: services/api/railway.toml
          - service: proresume-worker
            config: services/worker/railway.toml
          - service: proresume-cron
            config: services/cron/railway.toml
    steps:
      - uses: actions/checkout@v4

      - name: Skip without Railway token
        id: check
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN not set — skipping deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.check.outputs.skip != 'true'
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        if: steps.check.outputs.skip != 'true'
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cp "../${{ matrix.config }}" railway.toml
          railway link --service "${{ matrix.service }}" || railway link
          railway up --detach

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify production stack
        run: bash backend/scripts/verify-production.sh
