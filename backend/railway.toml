[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node src/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Railway root directory for ALL services: backend
# Config file per service (set in Railway service settings):
#   proresume-ai     → services/api/railway.toml
#   proresume-worker → services/worker/railway.toml
#   proresume-cron   → services/cron/railway.toml
