[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node src/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Railway service: proresume-ai (HTTP API)
# Also deploy: proresume-worker (railway.worker.toml), proresume-cron (railway.cron.toml)
# Plugins: PostgreSQL (required), Redis (optional, recommended)
