<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — ProResume AI</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
  <style>html,body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
  <div data-site-nav="default"></div>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <div id="auth-gate" class="hidden text-center py-20">
      <p class="text-zinc-400 mb-6">Sign in to manage your account and saved resumes.</p>
      <a href="/login.html?next=/account.html" class="inline-block px-6 py-3 bg-emerald-500 hover:bg-emerald-600 rounded-xl font-semibold">Sign In</a>
    </div>

    <div id="account-panel" class="hidden space-y-8">
      <div>
        <h1 class="text-3xl font-bold mb-2">My Account</h1>
        <p id="user-email" class="text-zinc-400"></p>
      </div>

      <div id="checkout-banner" class="hidden p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-300 text-sm">
        Payment successful! Your plan and credits will update shortly.
      </div>

      <div class="grid sm:grid-cols-3 gap-4">
        <div class="bg-zinc-900 border border-white/10 rounded-2xl p-6">
          <p class="text-zinc-500 text-xs uppercase tracking-wider mb-1">Plan</p>
          <p id="user-plan" class="text-2xl font-bold capitalize">—</p>
        </div>
        <div class="bg-zinc-900 border border-white/10 rounded-2xl p-6">
          <p class="text-zinc-500 text-xs uppercase tracking-wider mb-1">AI Credits</p>
          <p id="user-credits" class="text-2xl font-bold text-amber-400">—</p>
        </div>
        <div class="bg-zinc-900 border border-white/10 rounded-2xl p-6">
          <p class="text-zinc-500 text-xs uppercase tracking-wider mb-1">Resumes</p>
          <p id="resume-count" class="text-2xl font-bold">—</p>
        </div>
      </div>

      <section class="bg-zinc-900 border border-white/10 rounded-2xl p-6">
        <h2 class="text-lg font-semibold mb-4">Saved Resumes</h2>
        <ul id="resume-list" class="space-y-2 text-sm text-zinc-300"></ul>
        <a href="/builder.html" class="inline-block mt-4 text-emerald-400 hover:underline text-sm">Open resume builder →</a>
      </section>

      <section class="flex flex-wrap gap-3">
        <a href="/pricing.html" class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 rounded-xl font-semibold text-sm">Upgrade Plan</a>
        <button id="billing-btn" class="px-5 py-2.5 border border-white/20 hover:bg-white/5 rounded-xl font-semibold text-sm">Manage Billing</button>
        <button id="logout-btn" class="px-5 py-2.5 border border-white/10 text-zinc-400 hover:text-white rounded-xl text-sm">Sign Out</button>
      </section>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    async function loadAccount() {
      if (!ProResumeAPI.isLoggedIn()) {
        document.getElementById('auth-gate').classList.remove('hidden');
        return;
      }

      document.getElementById('account-panel').classList.remove('hidden');
      if (new URLSearchParams(location.search).get('checkout') === 'success') {
        document.getElementById('checkout-banner').classList.remove('hidden');
      }

      try {
        const user = await ProResumeAPI.me();
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-plan').textContent = user.plan;
        document.getElementById('user-credits').textContent = user.credits;

        const { resumes } = await ProResumeAPI.listResumes();
        document.getElementById('resume-count').textContent = resumes.length;
        document.getElementById('resume-list').innerHTML = resumes.map(r => `
          <li class="flex justify-between items-center py-2 border-b border-white/5">
            <span>${r.preview_name || r.title || 'Untitled'}${r.is_default ? ' <span class="text-emerald-400 text-xs">(default)</span>' : ''}</span>
            <span class="text-zinc-500 text-xs">${new Date(r.updated_at).toLocaleDateString()}</span>
          </li>
        `).join('') || '<li class="text-zinc-500">No resumes yet</li>';
      } catch (e) {
        document.getElementById('user-email').textContent = 'Could not load account — try signing in again.';
      }
    }

    document.getElementById('logout-btn')?.addEventListener('click', () => {
      ProResumeAPI.logout();
      location.href = '/';
    });

    document.getElementById('billing-btn')?.addEventListener('click', async () => {
      try {
        await ProResumeAPI.billingPortal();
      } catch (e) {
        alert(e.message || 'Billing portal unavailable. Subscribe first from the pricing page.');
      }
    });

    loadAccount();
  </script>
</body>
</html>
